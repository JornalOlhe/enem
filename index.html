<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulado ENEM 2016–2023</title>
  <link rel="stylesheet" href="css/style.css?v=202611161119" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">E</span>
      <div>
        <strong>Simulado ENEM</strong>
        <small>8 edições · 2016 a 2023</small>
      </div>
    </div>
    <div class="row"><div id="userBox" class="row"></div>
    <button class="theme-toggle" id="themeToggle" title="Alternar tema claro/escuro" aria-label="Alternar tema">◐</button></div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main id="view" class="view"></main>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Fechar">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div class="login" id="login" hidden></div>

  <script src="js/data.js?v=202611161119"></script>
  <script src="js/api.js?v=202611161119"></script>
  <script src="js/ai.js?v=202611161119"></script>
  <script src="js/estudo.js?v=202611161119"></script>
  <script src="js/app.js?v=202611161119"></script>
</body>
</html>
